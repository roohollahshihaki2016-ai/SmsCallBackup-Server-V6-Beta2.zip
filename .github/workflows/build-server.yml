name: Build and Test Server V6 Beta 2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Server ZIP
        run: |
          if [ ! -f "SmsCallBackup-Server-V6-Beta2.zip" ]; then
            echo "ERROR: ZIP file not found"
            ls -la
            exit 1
          fi

          unzip -o SmsCallBackup-Server-V6-Beta2.zip -d server-project

      - name: Find Server Project
        run: |
          REQ_FILE=$(find server-project -name requirements.txt -print -quit)

          if [ -z "$REQ_FILE" ]; then
            echo "ERROR: requirements.txt not found"
            exit 1
          fi

          SERVER_DIR=$(dirname "$REQ_FILE")
          echo "SERVER_DIR=$SERVER_DIR" >> "$GITHUB_ENV"

          echo "Found: $SERVER_DIR"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "$SERVER_DIR/requirements.txt"
          pip install httpx

      - name: Check Python Syntax
        run: |
          python -m compileall -q "$SERVER_DIR/app"

      - name: Test API and Auto Enrollment
        env:
          DB_PATH: ${{ runner.temp }}/smscall-v6-test.db
          RECEIVER_TOKEN: test_receiver_secret_123456789
        run: |
          PYTHONPATH="$SERVER_DIR" python -c '
          import hashlib
          import secrets
          from fastapi.testclient import TestClient
          from app.main import app

          receiver_token = "test_receiver_secret_123456789"
          receiver = {"Authorization": "Bearer " + receiver_token}

          with TestClient(app) as client:

              r = client.get("/health")
              assert r.status_code == 200

              credential = secrets.token_hex(32)
              credential_hash = hashlib.sha256(credential.encode()).hexdigest()

              enrollment = client.post(
                  "/v1/enrollments",
                  json={
                      "device_name": "Test Samsung",
                      "credential_hash": credential_hash
                  }
              )

              assert enrollment.status_code == 200
              request_id = enrollment.json()["request_id"]
              assert enrollment.json()["state"] == "pending"

              pending = client.get(
                  "/v1/enrollments",
                  headers=receiver
              )

              assert pending.status_code == 200
              assert len(pending.json()["requests"]) == 1

              approval = client.post(
                  "/v1/enrollments/" + request_id + "/approve",
                  headers=receiver
              )

              assert approval.status_code == 200
              assert approval.json()["state"] == "approved"
              assert approval.json()["sender_slot"] == "sender-1"

              sender = {
                  "Authorization": "Bearer " + credential
              }

              state = client.get(
                  "/v1/enrollments/" + request_id,
                  headers=sender
              )

              assert state.status_code == 200
              assert state.json()["state"] == "approved"

              heartbeat = client.post(
                  "/v1/heartbeat",
                  headers=sender,
                  json={}
              )

              assert heartbeat.status_code == 200

              upload = client.post(
                  "/v1/batches",
                  headers=sender,
                  json={
                      "batch_id": "test-batch-0001",
                      "ciphertext": "FAKE_TEST_CIPHERTEXT_123456789"
                  }
              )

              assert upload.status_code == 200

              download = client.get(
                  "/v1/batches",
                  headers=receiver
              )

              assert download.status_code == 200
              assert len(download.json()["batches"]) == 1

              ack = client.post(
                  "/v1/batches/ack",
                  headers=receiver,
                  json={"batch_ids": ["test-batch-0001"]}
              )

              assert ack.status_code == 200

              control = client.post(
                  "/v1/control",
                  headers=receiver,
                  json={
                      "sender_slot": "sender-1",
                      "enabled": False
                  }
              )

              assert control.status_code == 200

              denied = client.post(
                  "/v1/heartbeat",
                  headers=sender,
                  json={}
              )

              assert denied.status_code == 403

          print("ALL API TESTS PASSED")
          '

      - name: Validate Docker Compose
        run: |
          cd "$SERVER_DIR"
          cp .env.example .env
          export DOMAIN=example.com
          docker compose config -q

      - name: Create Server ZIP
        run: |
          cd "$SERVER_DIR"

          zip -r "$GITHUB_WORKSPACE/SmsCallBackup-Server-V6-Beta2-Validated.zip" . \
            -x "./.env" \
            -x "*/__pycache__/*" \
            -x "*.pyc"

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmsCallBackup-Server-V6-Beta2
          path: SmsCallBackup-Server-V6-Beta2-Validated.zip
          if-no-files-found: error
          retention-days: 30
